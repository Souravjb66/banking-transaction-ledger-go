version: "2"

sql:
  - engine: "postgresql"
    schema: "schema/"
    queries: "query/"
    gen:
      go:
        package: "db"
        out: "db"
        emit_json_tags: true
        emit_prepared_queries: true
        emit_interface: true
        emit_exact_table_names: true
        emit_empty_slices: true
